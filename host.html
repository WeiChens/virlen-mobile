<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virlen 电脑模拟器（联调）</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0f0f10;
        color: #ececf1;
        font: 14px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 15px;
        color: #9a9aa5;
      }
      .muted {
        color: #9a9aa5;
      }
      code {
        color: #8ab4ff;
      }
      a {
        color: #8ab4ff;
      }
      canvas {
        background: #fff;
        padding: 8px;
        border-radius: 12px;
      }
      pre {
        background: #1a1a1e;
        padding: 12px;
        border-radius: 10px;
        overflow: auto;
        font-size: 12px;
        max-width: 560px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 9px 14px;
        background: #4f7cff;
        color: #fff;
        cursor: pointer;
      }
      .modes {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      .modes button {
        background: #232329;
        border: 1px solid #3a3a44;
        color: #cfcfd6;
      }
      .modes button.active {
        background: #4f7cff;
        border-color: #4f7cff;
        color: #fff;
      }
      .row {
        display: flex;
        gap: 8px;
        margin: 8px 0 16px;
      }
      #log {
        max-height: 320px;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <div id="host-root"></div>
    <script type="module" src="/src/dev/host-harness.ts"></script>
  </body>
</html>
